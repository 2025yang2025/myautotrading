name: 台股多週期自動化交易機器人

on:
  schedule:
    # 星期一至星期五 台北時間 14:30 執行 (UTC 06:30)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Main Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit & Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只針對實際存在檔案進行 git add，避免歷史紀錄檔尚未產生時報錯
          [ -f targets.json ] && git add targets.json
          [ -f positions.json ] && git add positions.json
          [ -f history.csv ] && git add history.csv
          
          # 檢查是否有變更並提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update targets, positions & history [skip ci]" && git push)
